<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — CGPA Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <p class="font-mono text-xs tracking-[0.3em] uppercase brass-text mb-2">Academic Ledger</p>
      <h1 class="font-display text-3xl font-semibold">CGPA Tracker</h1>
      <p class="text-sm text-white/50 mt-1">Every semester, weighed and recorded.</p>
    </div>

    <div class="paper-soft rounded-lg p-6">
      <div class="flex mb-6 text-sm font-medium">
        <button id="tab-login" class="flex-1 pb-2 border-b-2" style="border-color: var(--brass);">Log in</button>
        <button id="tab-register" class="flex-1 pb-2 border-b-2 border-transparent text-white/40">Register</button>
      </div>

      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wide text-white/50 mb-1">Email</label>
          <input type="email" id="login-email" required class="w-full rounded px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wide text-white/50 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full rounded px-3 py-2 text-sm" />
        </div>
        <p id="login-error" class="text-sm crimson-text hidden"></p>
        <button type="submit" class="btn-brass w-full rounded py-2 text-sm">Enter the ledger</button>
      </form>

      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label class="block text-xs uppercase tracking-wide text-white/50 mb-1">Email</label>
          <input type="email" id="register-email" required class="w-full rounded px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wide text-white/50 mb-1">Password</label>
          <input type="password" id="register-password" required minlength="6" class="w-full rounded px-3 py-2 text-sm" />
          <p class="text-xs text-white/40 mt-1">At least 6 characters.</p>
        </div>
        <p id="register-error" class="text-sm crimson-text hidden"></p>
        <button type="submit" class="btn-brass w-full rounded py-2 text-sm">Open a ledger</button>
      </form>
    </div>
  </div>

<script src="/js/api.js"></script>
<script>
  if (localStorage.getItem("token")) window.location.href = "/dashboard.html";

  const tabLogin = document.getElementById("tab-login");
  const tabRegister = document.getElementById("tab-register");
  const formLogin = document.getElementById("form-login");
  const formRegister = document.getElementById("form-register");

  function showLogin() {
    formLogin.classList.remove("hidden");
    formRegister.classList.add("hidden");
    tabLogin.style.borderColor = "var(--brass)";
    tabLogin.classList.remove("text-white/40");
    tabRegister.style.borderColor = "transparent";
    tabRegister.classList.add("text-white/40");
  }
  function showRegister() {
    formRegister.classList.remove("hidden");
    formLogin.classList.add("hidden");
    tabRegister.style.borderColor = "var(--brass)";
    tabRegister.classList.remove("text-white/40");
    tabLogin.style.borderColor = "transparent";
    tabLogin.classList.add("text-white/40");
  }
  tabLogin.addEventListener("click", showLogin);
  tabRegister.addEventListener("click", showRegister);

  formLogin.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;
    const errEl = document.getElementById("login-error");
    errEl.classList.add("hidden");
    try {
      const data = await api("/api/auth/login", { method: "POST", body: { email, password } });
      localStorage.setItem("token", data.token);
      window.location.href = "/dashboard.html";
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove("hidden");
    }
  });

  formRegister.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("register-email").value;
    const password = document.getElementById("register-password").value;
    const errEl = document.getElementById("register-error");
    errEl.classList.add("hidden");
    try {
      const data = await api("/api/auth/register", { method: "POST", body: { email, password } });
      localStorage.setItem("token", data.token);
      window.location.href = "/dashboard.html";
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove("hidden");
    }
  });
</script>
</body>
</html>
